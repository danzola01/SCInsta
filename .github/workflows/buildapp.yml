# Inspired heavily by the following workflows
# https://github.com/arichornlover/uYouEnhanced/blob/main/.github/workflows/buildapp.yml
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml
# https://github.com/BandarHL/BHTwitter/actions/workflows/build.yml

name: Build and Package SCInsta

on:
    workflow_dispatch:
        inputs:
            ipa_release:
                description: "Unpublished draft release tag containing exactly one base IPA"
                required: true
                type: string
            ipa_sha256:
                description: "Expected SHA-256 of the inspected base IPA"
                required: true
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        name: Build SCInsta
        if: github.repository == 'danzola01/SCInsta' && github.ref == 'refs/heads/sidestore'
        runs-on: macos-latest
        permissions:
            contents: write

        steps:
            - name: Checkout Main
              uses: actions/checkout@v4
              with:
                path: main
                submodules: recursive

            - name: Retrieve and validate base IPA
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
                IPA_RELEASE: ${{ inputs.ipa_release }}
                EXPECTED_SHA256: ${{ inputs.ipa_sha256 }}
              run: |
                set -euo pipefail
                [[ "$EXPECTED_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid SHA-256"; exit 1; }
                [[ "$IPA_RELEASE" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || { echo "Invalid base release tag"; exit 1; }
                test "$(gh release view "$IPA_RELEASE" --json isDraft --jq '.isDraft')" = true
                count=$(gh release view "$IPA_RELEASE" --json assets --jq '[.assets[] | select(.name | endswith(".ipa"))] | length')
                test "$count" = 1
                mkdir -p main/packages main/output
                gh release download "$IPA_RELEASE" --pattern '*.ipa' --output main/packages/com.burbn.instagram.ipa
                python3 main/scripts/inspect_ipa.py main/packages/com.burbn.instagram.ipa --require-decrypted --sha256 "$EXPECTED_SHA256" --output main/output/base-ipa.json
                python3 - <<'PYTHON'
                import json
                from pathlib import Path
                report = json.loads(Path('main/output/base-ipa.json').read_text())
                if report['bundle_id'] != 'com.burbn.instagram':
                    raise SystemExit('Expected a base Instagram IPA')
                PYTHON

            - name: Install Dependencies
              run: brew install ldid dpkg make cmake

            - name: Set PATH environment variable
              run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

            - name: Setup Theos
              uses: actions/checkout@v4
              with:
                repository: theos/theos
                ref: master
                path: ${{ github.workspace }}/theos
                submodules: recursive

            # theos/logos master (777925d, theos/logos#114) rewrote %orig handling: it now
            # replaces everything from %orig to end-of-line and re-appends only ";", so any
            # %orig that is not alone on its line -- VOID_HANDLESCREENSHOT(%orig),
            # [SCIUtils liquidGlassEnabledBool:%orig], removeItemsInList(%orig, YES) -- loses
            # its closing bracket and the generated code no longer compiles. a623700 is the
            # commit directly before that change; drop this step once #114 is fixed upstream.
            - name: Pin Logos to known-good version
              run: |
                cd "$THEOS/vendor/logos"
                git fetch --depth=1 origin a62370066a97e36d59b200a9fa10c5091f5e8972
                git checkout a62370066a97e36d59b200a9fa10c5091f5e8972
              env:
                THEOS: ${{ github.workspace }}/theos
        
            - name: SDK Caching
              id: SDK
              uses: actions/cache@v4
              env:
                cache-name: iPhoneOS16.2.sdk
              with:
                path: ${{ github.workspace }}/theos/sdks/
                key: ${{ env.cache-name }}
                restore-keys: ${{ env.cache-name }}

            - name: Download iOS SDK
              if: steps.SDK.outputs.cache-hit != 'true'
              run: |
                git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/xybp888/iOS-SDKs/
                cd iOS-SDKs
                git sparse-checkout set --no-cone iPhoneOS16.2.sdk
                git checkout
                mv *.sdk $THEOS/sdks
              env:
                THEOS: ${{ github.workspace }}/theos

            - name: Get SCInsta Version
              id: scinsta_version
              run: |
                SCINSTA_VERSION=$(awk '/Version:/ {print $2}' main/control)

                echo "SCINSTA_VERSION=${SCINSTA_VERSION}" >> "$GITHUB_ENV"
                echo "version=${SCINSTA_VERSION}" >> "$GITHUB_OUTPUT"
            
            - name: Build sideload helper with nil-group fallback
              env:
                THEOS: ${{ github.workspace }}/theos
              run: |
                set -euo pipefail
                git clone --recurse-submodules https://github.com/asdfzxcvbn/zxPluginsInject.git
                cd zxPluginsInject
                git checkout d849cd510f9a925d692941b8d43c5efe1ca56649
                git submodule update --init --recursive
                python3 ../main/scripts/test_group_fallback.py src/SideloadFix.xm --expect-crash
                git apply --unidiff-zero ../main/patches/zxPluginsInject-nil-group.patch
                python3 ../main/scripts/test_group_fallback.py src/SideloadFix.xm
                make TARGET=iphone:clang:16.2:14.0
                test -f .theos/obj/debug/zxPluginsInject.dylib

            - name: Build SCInsta tweak for sideloading (as IPA)
              run: |
                pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip
                
                cd main
                curl --fail --location --output ipapatch https://github.com/asdfzxcvbn/ipapatch/releases/download/v2.1.3/ipapatch.macos-arm64
                chmod +x ipapatch
                export PATH=.:$PATH
                ls -la

                ./build.sh sideload
                ls -la packages
                
              env:
                THEOS: ${{ github.workspace }}/theos
                SCINSTA_DISPLAY_NAME: SCInsta
                SCINSTA_BUNDLE_ID: com.danzola.scinsta
                ZXPLUGINS_DYLIB: ${{ github.workspace }}/zxPluginsInject/.theos/obj/debug/zxPluginsInject.dylib

            - name: Validate generated IPA
              run: |
                set -euo pipefail
                python3 main/scripts/strip_extensions.py --check main/packages/SCInsta-sideloaded.ipa
                cp main/packages/SCInsta-sideloaded.ipa main/output/SCInsta.ipa
                python3 main/scripts/inspect_ipa.py main/output/SCInsta.ipa --require-decrypted --output main/output/built-ipa.json
                python3 - <<'PYTHON'
                import json
                from pathlib import Path
                report = json.loads(Path('main/output/built-ipa.json').read_text())
                if report['bundle_id'] != 'com.danzola.scinsta':
                    raise SystemExit('Unexpected output app identity')
                names = {Path(name).name for name in report['dylibs']}
                if not {'SCInsta.dylib', 'FLEXing.dylib', 'libflex.dylib'} <= names:
                    raise SystemExit('Missing expected injected libraries')
                PYTHON

            - name: Create unpublished output release
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                GH_REPO: ${{ github.repository }}
                OUTPUT_TAG: scinsta-ipa${{ github.run_id }}-${{ github.run_attempt }}
              run: |
                set -euo pipefail
                gh release create "$OUTPUT_TAG" main/output/SCInsta.ipa main/output/base-ipa.json main/output/built-ipa.json --draft --target "$GITHUB_SHA" --title "Personal SCInsta build $GITHUB_RUN_ID" --notes "Personal SideStore build. Keep this release unpublished."
                test "$(gh release view "$OUTPUT_TAG" --json isDraft --jq '.isDraft')" = true
                echo "Output is in unpublished draft release: $OUTPUT_TAG" >> "$GITHUB_STEP_SUMMARY"
